name: Render video
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip
        run: unzip -q avoid-list-explainer.zip
      - name: Voiceover on
        run: sed -i 's/INCLUDE_VOICEOVER_IN_RENDER = false/INCLUDE_VOICEOVER_IN_RENDER = true/' avoid-list-explainer/src/components/PreviewAudio.tsx
      - name: Chrome libs
        run: sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2
      - name: Install
        working-directory: avoid-list-explainer
        run: npm install
      - name: Render
        working-directory: avoid-list-explainer
        run: npx remotion render src/index.ts Main out/video.mp4 --codec h264 --crf 17
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: avoid-list-explainer/out/video.mp4
